name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, so a newly published rule finds old code without waiting for a
    # commit that may never come.
    - cron: '17 5 * * 2'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload results to code scanning

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The add-on is plain JavaScript running inside the game's sandbox: no
      # network, no filesystem, no credentials. Most of what CodeQL hunts for
      # cannot exist here. It is worth running anyway for the classes that can:
      # unreachable code, comparisons that are always true, a promise nobody
      # awaits, a variable used before assignment.
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript

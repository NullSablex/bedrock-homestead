name: Release Drafter

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

# Default: nothing. The single job opts into exactly what it needs.
permissions: {}

jobs:
  update-release-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create and update the release draft
      pull-requests: read  # read titles and labels to generate the notes
    steps:
      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

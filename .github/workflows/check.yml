name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust components
        run: rustup component add rustfmt clippy

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Rust check
        run: cargo check --workspace --all-targets

      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -W clippy::pedantic

      - name: Verify, stress and build
        run: cargo xtask all

      # Proof the package is installable, not merely that the build exited zero.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homestead-mcaddon
          path: dist/*.mcaddon
          if-no-files-found: error
